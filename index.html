<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KAIROS — AI Teaching Assistant</title>
<link rel="icon" type="image/png" href="src/Fav%20icon-01.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ── KAIROS Design Tokens ── */
:root {
  --background: 0 0% 100%;
  --foreground: 215 25% 27%;
  --card: 0 0% 100%;
  --muted: 214 32% 97%;
  --muted-foreground: 215 16% 47%;
  --border: 214 32% 91%;
  --input: 214 32% 91%;
  --primary: 120 100% 25%;
  --primary-foreground: 0 0% 100%;
  --primary-hover: 120 90% 30%;
  --primary-bold: 120 100% 20%;
  --primary-light: 84 91% 40%;
  --primary-glow: 93 88% 40%;
  --primary-button: 120 100% 22%;
  --brand-green: 84 91% 40%;
  --accent: 38 92% 50%;
  --accent-foreground: 0 0% 100%;
  --destructive: 0 84% 60%;
  --ring: 93 88% 40%;
  --radius: 0.75rem;

  --gradient-primary: linear-gradient(135deg, hsl(120 100% 20%), hsl(120 100% 25%));
  --gradient-subtle:  linear-gradient(180deg, hsl(0 0% 98%), hsl(214 32% 97%));
  --gradient-slide:   linear-gradient(180deg, hsl(0 0% 99%), hsl(214 32% 96%));
  --gradient-chat:    linear-gradient(180deg, hsl(214 20% 97%), hsl(214 32% 95%));
  --progress-gradient: linear-gradient(90deg, hsl(120 100% 20%), hsl(93 88% 40%));

  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.10), 0 2px 4px -2px rgb(0 0 0 / 0.10);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.10), 0 4px 6px -4px rgb(0 0 0 / 0.10);
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.10), 0 8px 10px -6px rgb(0 0 0 / 0.10);
  --shadow-elevated:       0 1px 2px rgb(0 0 0 / 0.04), 0 4px 8px rgb(0 0 0 / 0.04), 0 12px 24px rgb(0 0 0 / 0.06);
  --shadow-elevated-hover: 0 2px 4px rgb(0 0 0 / 0.04), 0 8px 16px rgb(0 0 0 / 0.06), 0 20px 40px rgb(0 0 0 / 0.08);

  --font-display: 'Montserrat', sans-serif;
  --font-body:    'Inter', -apple-system, 'Segoe UI', sans-serif;
  --font-mono:    'IBM Plex Mono', monospace;
}

/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--font-body);
  background: hsl(var(--muted));
  color: hsl(var(--foreground));
  font-size: 15px;
  line-height: 1.5;
}
h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -0.01em;
}

/* ── App Shell ── */
#app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: hsl(var(--muted)); }

/* ── Top Bar ── */
#topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
  height: 52px;
  background: hsl(var(--card));
  border-bottom: 1px solid hsl(var(--border) / 0.5);
  flex-shrink: 0; z-index: 10;
  position: relative;
}
#topbar-brand {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
#topbar-logo { height: 26px; width: auto; display: block; }
#topbar-favicon { height: 24px; width: auto; display: block; }
#topbar-divider { width: 1px; height: 18px; background: hsl(var(--border)); flex-shrink: 0; }
#topbar-course {
  font-size: 0.82rem; font-weight: 500;
  color: hsl(var(--foreground));
  flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Hamburger menu button */
#nav-toggle {
  width: 36px; height: 36px; border-radius: var(--radius);
  border: none; background: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: hsl(var(--foreground));
  transition: background 0.15s;
  flex-shrink: 0;
}
#nav-toggle:hover { background: hsl(var(--muted)); }
#nav-toggle svg { width: 18px; height: 18px; }
/* Progress label right-aligned */
#progress-label {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: hsl(var(--muted-foreground));
  flex-shrink: 0;
}
/* Thin progress line at very bottom of topbar */
#progress-bar {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 2px; background: hsl(var(--border) / 0.6);
}
#progress-fill {
  height: 100%;
  background: hsl(var(--primary));
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  width: 0%;
}

/* ── Main Panels ── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── Slide Panel ── */
#slide-panel {
  flex: 1; display: flex; flex-direction: column;
  background: hsl(215 20% 96%);
  overflow: hidden; min-width: 0;
  position: relative;
}
#slide-body {
  flex: 1;
  padding: 16px 20px 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
#slide-card {
  flex: 1;
  min-height: 0;
  border-radius: var(--radius);
  box-shadow: var(--shadow-elevated);
  overflow: hidden;
  background: #000;
  display: block;
}
#slide-image-wrap { width: 100%; height: 100%; }
#slide-image { width: 100%; height: 100%; object-fit: cover; display: block; }
#slide-video-wrap { width: 100%; height: 100%; background: #000; }
#slide-video { width: 100%; height: 100%; display: block; object-fit: cover; }
#slide-footer {
  padding: 8px 2px 12px;
  flex-shrink: 0;
}
#slide-title {
  font-family: var(--font-display);
  font-size: 0.82rem; font-weight: 500;
  color: hsl(var(--muted-foreground));
}

/* ── Slide Navigation Drawer ── */
#nav-overlay {
  display: none;
  position: fixed; inset: 0;
  background: hsl(0 0% 0% / 0.4);
  z-index: 50;
}
#nav-overlay.open { display: block; }
#nav-drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 340px;
  background: hsl(var(--card));
  box-shadow: var(--shadow-xl);
  z-index: 51;
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.3s ease;
}
#nav-drawer.open { transform: translateX(0); }
#nav-drawer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px;
  border-bottom: 1px solid hsl(var(--border) / 0.5);
  flex-shrink: 0;
}
#nav-drawer-title {
  font-family: var(--font-display);
  font-size: 1rem; font-weight: 600;
  color: hsl(var(--foreground));
}
#nav-close {
  width: 32px; height: 32px; border-radius: 50%;
  border: none; background: hsl(var(--muted)); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: hsl(var(--foreground));
  transition: background 0.15s;
}
#nav-close:hover { background: hsl(var(--border)); }
#nav-close svg { width: 16px; height: 16px; }
#nav-list { flex: 1; overflow-y: auto; padding: 12px 12px 16px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: var(--radius);
  font-size: 0.875rem; color: hsl(var(--muted-foreground));
  margin-bottom: 2px; border: none; background: none;
  width: 100%; text-align: left; cursor: default;
  transition: background 0.15s;
}
.nav-item.active {
  background: hsl(var(--primary));
  color: #fff;
  font-weight: 600;
}
.nav-item.done { color: hsl(var(--foreground)); }
.nav-item .nav-num {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  width: 22px; text-align: right; flex-shrink: 0;
  opacity: 0.5;
}
.nav-item.active .nav-num { opacity: 0.7; color: #fff; }
.nav-item .nav-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .nav-lock { font-size: 0.75rem; flex-shrink: 0; opacity: 0.35; }
.nav-item.done .nav-lock, .nav-item.active .nav-lock { opacity: 0; width: 0; }
#nav-drawer-footer {
  padding: 12px 16px;
  border-top: 1px solid hsl(var(--border) / 0.5);
}
#reset-btn {
  width: 100%; padding: 8px; border-radius: var(--radius);
  border: 1px solid hsl(var(--border));
  background: none; font-family: var(--font-body);
  font-size: 0.78rem; color: hsl(var(--muted-foreground));
  cursor: pointer; transition: background 0.15s;
}
#reset-btn:hover { background: hsl(var(--muted)); }

/* ── Chat Panel ── */
#chat-panel {
  width: 380px; flex-shrink: 0;
  display: flex; flex-direction: column;
  background: hsl(var(--card));
  border-left: 1px solid hsl(var(--border) / 0.5);
  overflow: hidden;
}
#chat-header {
  padding: 10px 16px 8px;
  border-bottom: 1px solid hsl(var(--border) / 0.4);
  flex-shrink: 0;
}
#chat-header-super {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: hsl(var(--muted-foreground));
  margin-bottom: 4px;
}
#chat-header-row {
  display: flex; align-items: center; gap: 10px;
}
#chat-header-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--gradient-primary);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
#chat-header-avatar svg { width: 15px; height: 15px; fill: #fff; }
#chat-header-title {
  font-family: var(--font-display);
  font-size: 0.9rem; font-weight: 600;
  color: hsl(var(--foreground));
  flex: 1;
}
.online-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: hsl(120 60% 45%);
  flex-shrink: 0;
  box-shadow: 0 0 0 2px hsl(120 60% 85%);
}
#chat-messages {
  flex: 1; overflow-y: auto;
  padding: 16px 14px 8px;
  display: flex; flex-direction: column; gap: 10px;
  background: hsl(214 32% 97%);
}

/* ── Messages ── */
.msg { display: flex; gap: 8px; }
.msg.user { flex-direction: row-reverse; }
.msg-bubble {
  max-width: 84%; padding: 10px 14px; border-radius: 16px;
  font-size: 0.875rem; line-height: 1.55; white-space: pre-wrap;
}
.msg.assistant .msg-bubble {
  background: hsl(var(--card));
  color: hsl(var(--foreground));
  border-bottom-left-radius: 4px;
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.08), 0 4px 12px rgb(0 0 0 / 0.05);
}
.msg.user .msg-bubble {
  background: hsl(var(--primary-button));
  color: #fff;
  border-bottom-right-radius: 4px;
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
}
.msg-bubble code {
  background: hsl(var(--muted)); border-radius: 4px; padding: 1px 5px;
  font-size: 0.82em; font-family: var(--font-mono);
}
.msg.user .msg-bubble code { background: hsl(0 0% 100% / 0.18); color: #fff; }
.msg-bubble.live::after {
  content: "▍"; display: inline-block;
  color: hsl(var(--primary-glow));
  animation: blink 0.8s step-end infinite; margin-left: 1px;
}
@keyframes blink { 50% { opacity: 0; } }

/* ── Status loader ── */
#status-box {
  margin: 0 14px 6px; padding: 7px 12px;
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border) / 0.5);
  border-left: 3px solid hsl(var(--primary-glow));
  border-radius: var(--radius);
  font-size: 0.78rem; color: hsl(var(--muted-foreground));
  display: none; align-items: center; gap: 8px;
  animation: fadeIn 0.2s ease;
}
#status-box.visible { display: flex; }
.spinner {
  width: 13px; height: 13px;
  border: 2px solid hsl(var(--border));
  border-top-color: hsl(var(--primary-glow));
  border-radius: 50%;
  animation: spin 0.8s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* ── Continue button ── */
#continue-wrap { padding: 8px 14px; flex-shrink: 0; display: none; }
#continue-btn {
  width: 100%; padding: 11px;
  border-radius: 9999px;
  background: hsl(var(--primary-button));
  color: #fff; border: none;
  font-family: var(--font-body);
  font-size: 0.875rem; font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow-elevated);
  transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
}
#continue-btn:hover {
  background: hsl(var(--primary-hover));
  box-shadow: var(--shadow-elevated-hover);
  transform: scale(1.02);
}

/* ── Input bar ── */
#input-wrap {
  padding: 10px 14px 14px;
  border-top: 1px solid hsl(var(--border) / 0.4);
  flex-shrink: 0; display: flex; gap: 8px;
  background: hsl(var(--card));
}
#user-input {
  flex: 1; padding: 9px 13px;
  border-radius: 9999px;
  border: 1px solid hsl(var(--input));
  font-family: var(--font-body);
  font-size: 0.875rem; outline: none;
  background: hsl(var(--muted));
  color: hsl(var(--foreground));
  transition: border-color 0.15s, box-shadow 0.15s;
  resize: none; max-height: 100px; line-height: 1.4;
}
#user-input:focus {
  border-color: hsl(var(--ring));
  box-shadow: 0 0 0 3px hsl(var(--ring) / 0.1);
  background: hsl(var(--card));
}
#send-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: hsl(var(--primary-button));
  color: #fff; border: none;
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, transform 0.2s;
}
#send-btn svg { width: 16px; height: 16px; fill: #fff; }
#send-btn:hover { background: hsl(var(--primary-hover)); transform: scale(1.06); }
#send-btn:disabled { background: hsl(var(--border)); cursor: not-allowed; transform: none; }

/* ── Course Entry Screen ── */
#course-entry {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  overflow: hidden;
}
#entry-bg {
  position: absolute; inset: 0;
  background: #fff;
  z-index: 0;
}
#entry-bg::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 900px; height: 440px;
  background-image: url('src/login-header-image.png');
  background-size: cover;
  background-position: center top;
  border-radius: 0 0 50% 50%;
}
#entry-bg::after {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 860px; height: 440px;
  border-radius: 0 0 50% 50%;
  background: linear-gradient(180deg, transparent 55%, #fff 100%);
}
.entry-card {
  position: relative; z-index: 1;
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border) / 0.5);
  border-radius: calc(var(--radius) * 2);
  padding: 28px 32px 24px;
  box-shadow: var(--shadow-xl);
  text-align: center;
  width: 420px; max-width: 94vw;
}
.entry-logo-row {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; margin-bottom: 4px;
}
.entry-logo-img { height: 26px; width: auto; }
.entry-kairos-label {
  font-family: var(--font-display);
  font-size: 1.4rem; font-weight: 700;
  color: hsl(var(--foreground));
  letter-spacing: 0.04em;
}
.entry-card h1 {
  font-size: 0.78rem; font-weight: 400;
  color: hsl(var(--muted-foreground));
  margin-bottom: 16px;
  font-family: var(--font-body);
}
.entry-card p {
  font-size: 0.8rem;
  color: hsl(var(--muted-foreground));
  margin-bottom: 14px;
}
.entry-form { display: flex; flex-direction: column; gap: 6px; }
.entry-field-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  color: hsl(var(--muted-foreground));
  text-align: left; text-transform: uppercase; letter-spacing: 0.1em;
  margin-bottom: -2px;
}
.entry-input {
  padding: 8px 12px; border-radius: var(--radius);
  border: 1px solid hsl(var(--input));
  font-family: var(--font-body);
  font-size: 0.82rem; outline: none;
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  transition: border-color 0.15s, box-shadow 0.15s; width: 100%;
}
.entry-input:focus {
  border-color: hsl(var(--ring));
  box-shadow: 0 0 0 3px hsl(var(--ring) / 0.12);
}
.entry-textarea {
  padding: 7px 12px; border-radius: var(--radius);
  border: 1px solid hsl(var(--input));
  font-family: var(--font-body);
  font-size: 0.82rem; outline: none; resize: none;
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  transition: border-color 0.15s, box-shadow 0.15s; width: 100%; line-height: 1.4;
}
.entry-textarea:focus {
  border-color: hsl(var(--ring));
  box-shadow: 0 0 0 3px hsl(var(--ring) / 0.12);
}
.entry-divider { height: 1px; background: hsl(var(--border) / 0.5); margin: 2px 0; }
#course-id-btn {
  padding: 11px; border-radius: 9999px;
  background: hsl(var(--primary-button));
  color: hsl(var(--primary-foreground));
  border: none;
  font-family: var(--font-body);
  font-size: 0.875rem; font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow-elevated);
  transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
  margin-top: 6px;
}
#course-id-btn:hover {
  background: hsl(var(--primary-hover));
  box-shadow: var(--shadow-elevated-hover);
  transform: scale(1.02);
}
#course-id-btn:disabled {
  background: hsl(var(--border));
  color: hsl(var(--muted-foreground));
  cursor: not-allowed; transform: none; box-shadow: none;
}
.entry-error {
  color: hsl(var(--destructive));
  font-size: 0.82rem; margin-top: 8px;
}

/* ── Loading Overlay ── */
#loading {
  position: fixed; inset: 0;
  background: hsl(var(--background) / 0.92);
  backdrop-filter: blur(4px);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px; z-index: 100;
  font-size: 0.9rem;
  color: hsl(var(--muted-foreground));
  font-family: var(--font-body);
}
#loading .big-spin {
  width: 36px; height: 36px;
  border: 3px solid hsl(var(--border));
  border-top-color: hsl(var(--primary-glow));
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<!-- ── Course Entry Screen ── -->
<div id="course-entry">
  <div id="entry-bg"></div>
  <div class="entry-card">
    <div class="entry-logo-row">
      <img class="entry-logo-img" src="src/evo11ve-logo.png" alt="evo11ve" onerror="this.style.display='none'" />
    </div>
    <div class="entry-kairos-label">KAIROS</div>
    <h1>AI-Native Learning Infrastructure</h1>
    <div class="entry-form">
      <div class="entry-field-label">Course ID</div>
      <input id="course-id-input" class="entry-input" type="text" placeholder="e.g. cashflow_001" autocomplete="off" />

      <div class="entry-divider"></div>

      <div class="entry-field-label">Your Name</div>
      <input id="entry-name" class="entry-input" type="text" placeholder="e.g. Akash" autocomplete="off" />

      <div class="entry-field-label">Your Role</div>
      <input id="entry-role" class="entry-input" type="text" placeholder="e.g. Field Service Engineer" autocomplete="off" />

      <div class="entry-field-label">Key Skills <span style="font-weight:400;text-transform:none;letter-spacing:0">(comma-separated)</span></div>
      <input id="entry-skills" class="entry-input" type="text" placeholder="e.g. On-site installation, Work order documentation" autocomplete="off" />

      <div class="entry-field-label">About Your Role</div>
      <textarea id="entry-desc" class="entry-textarea" rows="2" placeholder="Briefly describe what you do day-to-day…"></textarea>

      <button id="course-id-btn">Start Course →</button>
    </div>
    <div id="course-id-error" class="entry-error" style="display:none"></div>
  </div>
</div>

<!-- ── Loading Overlay ── -->
<div id="loading" style="display:none">
  <div class="big-spin"></div>
  <span id="loading-text">Loading course…</span>
</div>

<!-- ── Nav Drawer Overlay ── -->
<div id="nav-overlay">
  <div id="nav-drawer">
    <div id="nav-drawer-header">
      <div id="nav-drawer-title">Slide Navigation</div>
      <button id="nav-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="nav-list"></div>
    <div id="nav-drawer-footer">
      <button id="reset-btn">Reset session</button>
    </div>
  </div>
</div>

<!-- ── App Shell ── -->
<div id="app" style="display:none">

  <!-- Top Bar -->
  <div id="topbar">
    <div id="topbar-brand">
      <img id="topbar-logo" src="src/evo11ve-logo.png" alt="evo11ve" onerror="this.style.display='none'" />
      <img id="topbar-favicon" src="src/Fav%20icon-01.png" alt="KAIROS" />
    </div>
    <div id="topbar-divider"></div>
    <div id="topbar-course">AI Teaching Assistant</div>
    <div id="progress-label">Slide 1 of 1</div>
    <button id="nav-toggle" aria-label="Open navigation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </div>

  <div id="main">

    <!-- Slide Panel -->
    <div id="slide-panel">
      <div id="slide-body">
        <div id="slide-card">
          <div id="slide-image-wrap" style="display:none">
            <img id="slide-image" src="" alt="Slide" />
          </div>
          <div id="slide-video-wrap" style="display:none">
            <video id="slide-video" controls preload="metadata">
              <source id="slide-video-src" src="" type="video/mp4" />
            </video>
          </div>
        </div>
        <div id="slide-footer">
          <div id="slide-title">—</div>
        </div>
      </div>
    </div>

    <!-- Chat Panel -->
    <div id="chat-panel">
      <div id="chat-header">
        <div id="chat-header-super">AI Assistant</div>
        <div id="chat-header-row">
          <div id="chat-header-avatar">
            <img src="src/Fav%20icon-01.png" alt="KAIROS" style="width:18px;height:18px;object-fit:contain;" />
          </div>
          <div id="chat-header-title">AI Training Assistant</div>
          <div class="online-dot"></div>
        </div>
      </div>
      <div id="chat-messages"></div>

      <!-- Live status loader -->
      <div id="status-box">
        <div class="spinner"></div>
        <span id="status-text">Thinking…</span>
      </div>

      <!-- Continue button -->
      <div id="continue-wrap">
        <button id="continue-btn">Continue →</button>
      </div>

      <!-- Input -->
      <div id="input-wrap">
        <textarea id="user-input" placeholder="Tell me your role…" rows="1"></textarea>
        <button id="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </div>
    </div>

  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
const API = "/kairos";
let sessionId   = null;
let courseId    = null;
let courseItems = [];
let currentIdx  = 0;
let busy        = false;
let readyToProc = false;
const visitedSlides = new Set();

// ── DOM refs ──────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const courseEntry   = $("course-entry");
const courseInput   = $("course-id-input");
const entryName     = $("entry-name");
const entryRole     = $("entry-role");
const entrySkills   = $("entry-skills");
const entryDesc     = $("entry-desc");
const courseBtn     = $("course-id-btn");
const courseErr     = $("course-id-error");
const loading       = $("loading");
const loadingText   = $("loading-text");
const appEl         = $("app");
const navList       = $("nav-list");
const slideTitle    = $("slide-title");
const slideImgWrap  = $("slide-image-wrap");
const slideImg      = $("slide-image");
const slideVidWrap  = $("slide-video-wrap");
const slideVideoSrc = $("slide-video-src");
const slideVideo    = $("slide-video");
let VIDEO_URL = "";
let IMAGE_URL = "";
const progressFill  = $("progress-fill");
const progressLbl   = $("progress-label");
const chatMessages  = $("chat-messages");
const statusBox     = $("status-box");
const statusText    = $("status-text");
const continueWrap  = $("continue-wrap");
const continueBtn   = $("continue-btn");
const userInput     = $("user-input");
const sendBtn       = $("send-btn");

// ── Pre-fill user profile ─────────────────────────────────────────────────────
const USER_PROFILE = {
  "course-id-input": "intro_data_analytics",
  "name": "Akash",
  "role": "Senior Manager (Business Analyst)",
  "skills": [
    "Strategic thinking","Advanced data analysis","Stakeholder management",
    "Business process optimization","Requirements engineering","SQL","Excel",
    "Data visualization (Power BI/Tableau)","Decision-making frameworks",
    "Financial analysis","Agile & Scrum methodologies","Risk assessment",
    "Communication & storytelling","Leadership & mentoring","Problem-solving"
  ],
  "description": "As a Senior Manager (Business Analyst), I lead the translation of business goals into data-driven strategies and actionable solutions. I collaborate with senior stakeholders to define requirements, optimize processes, and drive strategic initiatives. Using advanced analytics, visualization, and structured problem-solving, I uncover insights that support high-impact decision-making. I also mentor teams, ensure alignment between business and technology, and focus on delivering scalable, efficient, and measurable outcomes."
};
courseInput.value = USER_PROFILE["course-id-input"];
entryName.value   = USER_PROFILE.name;
entryRole.value   = USER_PROFILE.role;
entrySkills.value = USER_PROFILE.skills.join(", ");
entryDesc.value   = USER_PROFILE.description;

// ── Course entry ──────────────────────────────────────────────────────────────
async function startCourse() {
  const id   = courseInput.value.trim();
  const name = entryName.value.trim();
  const role = entryRole.value.trim();

  if (!id)   { showEntryError("Please enter a Course ID."); return; }
  if (!name) { showEntryError("Please enter your name."); return; }
  if (!role) { showEntryError("Please enter your role."); return; }

  const skillsets   = entrySkills.value.split(",").map(s => s.trim()).filter(Boolean);
  const description = entryDesc.value.trim();

  courseBtn.disabled        = true;
  courseErr.style.display   = "none";
  courseEntry.style.display = "none";
  loading.style.display     = "flex";
  loadingText.textContent   = `Loading course "${id}"…`;

  try {
    await init(id, name, role, skillsets, description);
  } catch (e) {
    loading.style.display     = "none";
    courseEntry.style.display = "flex";
    courseBtn.disabled        = false;
    showEntryError(e.message || "Could not load course. Check the Course ID and try again.");
  }
}

function showEntryError(msg) {
  courseErr.textContent   = msg;
  courseErr.style.display = "block";
}

courseBtn.addEventListener("click", startCourse);

// ── Init ──────────────────────────────────────────────────────────────────────
async function init(id, name, role, skillsets, description) {
  const resp = await fetch(`${API}/api/session/new`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      course_id:        id,
      user_name:        name        || "",
      user_role:        role        || "",
      user_skillsets:   skillsets   || [],
      user_description: description || "",
    }),
  });

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.detail || `Server error ${resp.status}`);
  }

  const data  = await resp.json();
  sessionId   = data.session_id;
  courseId    = id;
  courseItems = data.course_items;
  VIDEO_URL   = data.video_url || "";
  IMAGE_URL   = data.image_url || "";
  currentIdx  = 0;

  renderNav();
  loadSlide(0, true);
  loading.style.display = "none";
  appEl.style.display   = "flex";
}

// ── Nav drawer toggle ─────────────────────────────────────────────────────────
const navOverlay = $("nav-overlay");
const navDrawer  = $("nav-drawer");
$("nav-toggle").addEventListener("click", () => {
  navOverlay.classList.add("open");
  navDrawer.classList.add("open");
});
$("nav-close").addEventListener("click", closeNav);
navOverlay.addEventListener("click", e => { if (e.target === navOverlay) closeNav(); });
function closeNav() {
  navOverlay.classList.remove("open");
  navDrawer.classList.remove("open");
}

// ── Navigation ────────────────────────────────────────────────────────────────
function renderNav() {
  navList.innerHTML = "";
  courseItems.forEach((item, i) => {
    const btn = document.createElement("button");
    const state = i === currentIdx ? "active" : item.status === "completed" ? "done" : "upcoming";
    btn.className = "nav-item " + state;
    btn.innerHTML = `
      <span class="nav-num">${i + 1}.</span>
      <span class="nav-title">${item.title}</span>
      <span class="nav-lock">🔒</span>
    `;
    navList.appendChild(btn);
  });
}

function updateProgress() {
  const total = courseItems.length;
  const pct   = ((currentIdx + 1) / total) * 100;
  progressFill.style.width = pct + "%";
  progressLbl.textContent  = `Slide ${currentIdx + 1} of ${total}`;
}

// ── Load a slide ──────────────────────────────────────────────────────────────
async function loadSlide(idx, isInit) {
  currentIdx  = idx;
  readyToProc = false;
  continueWrap.style.display = "none";
  $("input-wrap").style.display = "flex";
  chatMessages.innerHTML     = "";
  hideStatus();

  const item = courseItems[idx];

  slideTitle.textContent = item.title;

  if (item.type === "video") {
    slideImgWrap.style.display = "none";
    slideVidWrap.style.display = "block";
    slideVideoSrc.src = `${VIDEO_URL}/${courseId}/${item.video_name}.mp4`;
    slideVideo.load();
  } else {
    slideVidWrap.style.display = "none";
    slideImgWrap.style.display = "block";
    slideImg.src = item.image_name ? `${IMAGE_URL}/${courseId}/${item.image_name}` : "";
    slideImg.alt = item.title;
  }

  updateProgress();
  renderNav();

  if (visitedSlides.has(idx)) {
    try {
      const histResp = await fetch(`${API}/api/session/${sessionId}/messages`);
      if (histResp.ok) {
        const histData = await histResp.json();
        const msgs = (histData.messages || []).filter(m => m.content !== "[slide loaded]");
        msgs.forEach(m => appendMessage(m.role, m.content));
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    } catch (_) {}
    setBusy(false);
    return;
  }

  visitedSlides.add(idx);
  setBusy(true);
  const resp = await fetch(`${API}/api/chat`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, course_id: courseId, message: "[slide loaded]" }),
  });
  await consumeStream(resp);
}

// ── SSE: chat ─────────────────────────────────────────────────────────────────
async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || busy) return;

  userInput.value = "";
  autoGrow();
  appendMessage("user", text);
  setBusy(true);
  const resp = await fetch(`${API}/api/chat`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, course_id: courseId, message: text }),
  });

  await consumeStream(resp);
}

// ── Stream consumer ───────────────────────────────────────────────────────────
async function consumeStream(resp, onDone) {
  const reader  = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer    = "";
  let liveBubble = null;

  function getOrCreateBubble() {
    if (!liveBubble) liveBubble = createLiveBubble();
    return liveBubble;
  }

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    const frames = buffer.split("\n\n");
    buffer = frames.pop();

    for (const frame of frames) {
      const lines = frame.trim().split("\n");
      let event = "message", data = "";
      for (const line of lines) {
        if (line.startsWith("event: ")) event = line.slice(7).trim();
        if (line.startsWith("data: "))  data  = line.slice(6).trim();
      }
      if (!data) continue;
      const d = JSON.parse(data);

      if (event === "token") {
        hideStatus();
        const bubble = getOrCreateBubble();
        appendToken(bubble, d.text);

      } else if (event === "status") {
        if (liveBubble) { finaliseBubble(liveBubble); liveBubble = null; }
        showStatus(d.text);

      } else if (event === "result") {
        hideStatus();
        setBusy(false);
        if (liveBubble) finaliseBubble(liveBubble);
        liveBubble = null;
        if (d.ready_to_proceed) showContinue();
        if (onDone) onDone();
        return;

      } else if (event === "error") {
        hideStatus();
        setBusy(false);
        if (liveBubble) finaliseBubble(liveBubble);
        liveBubble = null;
        appendMessage("assistant", `(${d.message})`);
        if (onDone) onDone();
        return;
      }
    }
  }

  hideStatus();
  setBusy(false);
  if (liveBubble) finaliseBubble(liveBubble);
}

// ── Continue / advance ────────────────────────────────────────────────────────
continueBtn.addEventListener("click", async () => {
  if (busy) return;
  busy = true;
  setBusy(true);
  continueWrap.style.display = "none";
  $("input-wrap").style.display = "flex";

  await fetch(`${API}/api/advance`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, course_id: courseId, item_index: currentIdx }),
  });

  courseItems[currentIdx].status = "completed";
  const nextIdx = currentIdx + 1;
  if (nextIdx < courseItems.length) {
    courseItems[nextIdx].status = "current";
    await loadSlide(nextIdx, false);
  } else {
    appendMessage("assistant", "You've completed the course! Great work.");
    renderNav();
  }

  setBusy(false);
  busy = false;
});

// ── Reset ─────────────────────────────────────────────────────────────────────
$("reset-btn").addEventListener("click", async () => {
  if (!confirm("Reset your session? All progress will be lost.")) return;
  appEl.style.display       = "none";
  courseEntry.style.display = "flex";
  courseBtn.disabled        = false;
  courseErr.style.display   = "none";
});

// ── UI helpers ────────────────────────────────────────────────────────────────
function appendMessage(role, text) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div>`;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function createLiveBubble() {
  const div = document.createElement("div");
  div.className = "msg assistant";
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble live";
  bubble.dataset.raw = "";
  div.appendChild(bubble);
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return bubble;
}

function appendToken(bubble, chunk) {
  bubble.dataset.raw += chunk;
  bubble.innerHTML = escapeHtml(bubble.dataset.raw);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function finaliseBubble(bubble) {
  bubble.classList.remove("live");
  bubble.dataset.raw = bubble.dataset.raw.replace(/\[READY_TO_PROCEED\]/g, "").trim();
  bubble.innerHTML = escapeHtml(bubble.dataset.raw);
}

function escapeHtml(str) {
  let s = str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
  s = s.replace(/\n/g, "<br>");
  return s;
}

function showStatus(text) {
  statusText.textContent = text;
  statusBox.classList.add("visible");
  chatMessages.scrollTop = chatMessages.scrollHeight;
}
function hideStatus() { statusBox.classList.remove("visible"); }
function showContinue() {
  readyToProc = true;
  continueWrap.style.display = "block";
  $("input-wrap").style.display = "none";
}
function setBusy(state) {
  busy = state;
  sendBtn.disabled   = state;
  userInput.disabled = state;
}

// ── Input: auto-grow textarea, Enter to send ──────────────────────────────────
function autoGrow() {
  userInput.style.height = "auto";
  userInput.style.height = Math.min(userInput.scrollHeight, 100) + "px";
}
userInput.addEventListener("input", autoGrow);
userInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener("click", sendMessage);

// ── Boot ──────────────────────────────────────────────────────────────────────
// Entry screen handles init — no auto-boot
</script>
</body>
</html>
